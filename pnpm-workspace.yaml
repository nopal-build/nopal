packages:
  - "webapp"
  - "fruits"
  - "packages/*"

allowBuilds:
  es5-ext: true
  esbuild: true
  # Downloads the ffmpeg binary for the platform running the install --
  # the worker's Dockerfile runs `pnpm install` inside the linux image, so
  # it gets linux-x64 there and a developer's Mac gets its own. Used by
  # sync-knowledge to pull frames from a video attachment.
  ffmpeg-static: true
  msgpackr-extract: true

# Without this, `pnpm install` only resolves optional, platform-specific
# packages (sharp's own `@img/sharp-*`/`@img/sharp-libvips-*` binaries,
# one per OS/CPU/libc combo) for whatever machine happens to run the
# install that regenerates the lockfile — e.g. a developer's macOS laptop.
# `webapp`/`packages/worker`'s Dockerfiles run `pnpm install --frozen-
# lockfile` (never re-resolving anything) on `node:22-slim` (Debian/glibc,
# linux-x64), so without the linux-x64 variant already present in the
# lockfile, that install silently ends up short a native binary sharp
# needs at runtime — exactly the "Could not load the sharp module using
# the linux-x64 runtime" production error this fixes. `current` keeps
# whatever platform a developer is actually running `pnpm install` on
# (e.g. macOS/arm64) also resolved, so local dev is unaffected.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc

# Makes `pnpm deploy` (used to build a genuinely standalone, pruned
# node_modules for `packages/worker` — see the phylog skill's "Scaling &
# Process Isolation" section) copy workspace dependencies (robustness-core,
# oxmarkdown-core) into the deploy output instead of symlinking back to
# this checkout. Without this, a deploy target only works as long as this
# exact repo checkout still exists on disk at the same path — useless once
# copied alone into a Docker image.
injectWorkspacePackages: true

# `robustness-core`/`oxmarkdown-core` are injected (hard-linked copies, not
# symlinks) per the setting above, needed for `pnpm deploy`'s standalone
# prod builds (see that comment). A hard-linked copy does NOT pick up a
# source change on a plain `pnpm install` re-run (e.g. after `git pull`
# changes one of those packages), which left `fruits`/`webapp`/`worker`'s
# local dev containers (`docker-compose.yml`) silently running stale core
# code, or outright failing to resolve a newly added `exports` entry
# ("Missing \"./data/x.server\" specifier in \"robustness-core\" package")
# until someone noticed and force-reinstalled by hand. `dev` is every
# service's own long-running dev script name (`fruits`/`webapp`'s
# `node ./server.js`, `worker`'s `vite-node --watch worker.ts`) --
# running it here keeps the injected copies synced against real source
# for as long as that script keeps running, without disabling injection
# (and breaking `pnpm deploy`) outright.
syncInjectedDepsAfterScripts:
  - dev

# ffmpeg-static's download helper (`@derhuerst/http-basic`) declares
# `@types/node@10` as a runtime dependency, and pnpm's default hoisting
# put that ten-year-old typings package where TypeScript found it first,
# breaking `stream` types in unrelated files. Pin every resolution to the
# version the rest of the workspace already compiles against.
overrides:
  "@types/node": "^26.2.0"

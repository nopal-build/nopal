# fly.toml for a staging copy of fruits — same image as fly.toml, deployed
# to its own Fly app so it never touches production traffic.
#
# First-time setup -- see docs/phase-7-cutover-runbook.md for the full,
# ordered sequence. Short version:
#   1. fly apps create nopal-fruits   (prod app must exist FIRST --
#      staging's secrets are copied from it, not from webapp)
#   2. fly apps create fruits-staging
#   3. sh fruits/scripts/copy-secrets-from-webapp.sh   (bootstraps nopal-fruits
#      from webapp's prod secrets -- run this before step 4)
#   4. sh fruits/scripts/copy-secrets-to-staging.sh   (nopal-fruits -> fruits-staging)
#   5. make deploy-staging
#   6. make clone-staging-db SURREAL_PASS=<prod-pass>   (populates the
#      `staging` database — shared with webapp's own staging copy, empty
#      until this runs at least once)
#
# Build context is the REPO ROOT — deploy from the repo root:
#
#   fly deploy . --config fruits/fly.staging.toml --dockerfile fruits/Dockerfile

app = 'fruits-staging'
primary_region = 'lax'

[build]

[deploy]
strategy = 'bluegreen'

[env]
# The only thing that differs from prod's own env/secrets — see
# packages/robustness-core/src/data/db.server.ts. Everything else
# (DATABASE_URL, credentials, NS) is identical to prod on purpose: this
# is the SAME SurrealDB instance, just a different `database` selected --
# the SAME `staging` database webapp's own staging copy already uses.
DATABASE_DATABASE = 'staging'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[http_service.checks]]
grace_period = '10s'
interval = '15s'
method = 'GET'
path = '/api/health'
timeout = '5s'

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1

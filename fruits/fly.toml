# fly.toml app configuration file for the fruits app (o.nopal.build) --
# split out from webapp, see docs/marketing-app-split-plan.md.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Build context is the REPO ROOT (fruits depends on the `robustness-core`/
# `oxmarkdown-core`/`stamps` workspace packages) — deploy from the repo root:
#
#   fly deploy . --config fruits/fly.toml --dockerfile fruits/Dockerfile
#
# (`make deploy` does this for you.) GraphLog's queue worker is its own,
# separate Fly app — see packages/worker/fly.toml. webapp (marketing,
# nopal.build) is also its own separate Fly app — see webapp/fly.toml. A
# staging copy of THIS app lives at fly.staging.toml (`make deploy-staging`),
# same image, separate Fly app, pointed at an isolated `staging` database
# instead of prod's `opuntia` (see db/clone-to-staging.sh).

app = 'nopal-fruits' # matches the nopal-phylog-worker/nopal-webapp-staging naming convention -- confirm available with `fly apps create nopal-fruits` (Fly app names are globally unique); edit this + fly.staging.toml + the runbook if taken.
primary_region = 'lax'

[build]

# Zero-downtime deploys: boot a full parallel machine per existing one,
# wait for /api/health to pass on all of them, THEN flip traffic and kill
# the old ones — requires at least one health check (below) to be defined.
[deploy]
strategy = 'bluegreen'

# CRITICAL, not cosmetic -- see docs/marketing-app-split-plan.md's
# "Critical risks" #1 and docs/phase-7-cutover-runbook.md. Every passkey
# registered by an existing user was registered while this app's routes
# were served from nopal.build (today: nopal.build/fruits) -- WebAuthn
# binds a credential to whatever rpID was active AT REGISTRATION time.
# Without this pin, `webauthn.server.ts`'s `getRpID` falls back to
# deriving the rpID from the request's own hostname, which becomes
# "o.nopal.build" the moment this app goes live there -- silently
# breaking passkey login for every existing user, with no user-facing
# explanation. "nopal.build" is valid here even though this app is
# served from the o.nopal.build SUBDOMAIN -- WebAuthn allows rpID to be
# any registrable-domain suffix of the actual origin.
#
# Deliberately NOT set in fly.staging.toml -- staging's DB is a clone of
# prod's (see db/clone-to-staging.sh), so it also contains those same
# real rpID="nopal.build" passkey credentials, but staging has never been
# reachable from anything OTHER than its own fly.dev/staging hostname --
# passkey login there was already broken before this change (hostname-
# derived rpID never matched the cloned credentials' real "nopal.build"),
# so there is nothing to preserve by pinning it there too. TOTP
# (email-code) login is unaffected either way -- it isn't domain-bound.
[env]
WEBAUTHN_RP_ID = 'nopal.build'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 2
processes = ['app']

[[http_service.checks]]
grace_period = '10s'
interval = '15s'
method = 'GET'
path = '/api/health'
timeout = '5s'

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1

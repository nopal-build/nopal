# ─────────────────────────────────────────────────────────────────────────────
# Grafana config — fly.io
#
# Explicit file is more reliable than GF_SERVER_* env vars across image
# versions. Secrets (admin user/pass, Fly Prometheus token, Discord webhook)
# are still injected via `fly secrets set` as GF_SECURITY_*/FLY_PROM_TOKEN/
# DISCORD_ALERT_WEBHOOK_URL env vars, read by this file and by the
# provisioning YAML (which support $ENV_VAR interpolation directly).
# ─────────────────────────────────────────────────────────────────────────────

[server]
protocol   = http
http_addr  = 0.0.0.0
http_port  = 3000
domain     = nopal-grafana.fly.dev
root_url   = https://nopal-grafana.fly.dev

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db

[paths]
data         = /var/lib/grafana
logs         = /var/log/grafana
plugins      = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[log]
mode  = console
level = info

[analytics]
reporting_enabled  = false
check_for_updates  = false

# Explicit even though it's the default in current Grafana versions --
# alerting is the whole point of self-hosting instead of using Fly's
# managed fly-metrics.net Grafana (which has this disabled), so don't rely
# on an upstream default that could change.
[unified_alerting]
enabled = true

[package]
name = "nopal-app"
version = "0.1.0"
edition = "2021"
publish = false
description = "Nopal — native macOS app (login + Vault browsing, with syncing to follow)"

[[bin]]
name = "Nopal"
path = "src/main.rs"

[dependencies]
nopal-core = { path = "../core" }
eframe = "0.29"
rfd = "0.15"
open = "5"
serde_json = "1"
dirs = "5"
jiff = { version = "0.1", features = ["std"] }

[package.metadata.dist]
dist = false

[package]
name = "cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "cli"
path = "src/main.rs"

[dependencies]
# reframed.workspace = true
serialport = "4.2.0"
jiff = { version = "0.1", features = ["std"] }
clap = { version = "4.4", features = ["derive"] }
tiny_http = "0.12"
open = "5"
keyring = "2"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
dirs = "5"
hostname = "0.4"

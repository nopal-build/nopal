[package]
name = "nopal"
version = "0.0.10"
edition = "2021"
publish = false
description = "Nopal CLI — video prep and Nopal Vault sync utilities"
repository = "https://github.com/gwing33/nopal"
license = "MIT"
readme = false

[[bin]]
name = "nopal"
path = "src/main.rs"

# `publish = false` above is about crates.io, not dist — this crate should
# still be distributed as a downloadable binary via GitHub Releases.
[package.metadata.dist]
dist = true

[dependencies]
# reframed.workspace = true
serialport = "4.2.0"
jiff = { version = "0.1", features = ["std"] }
clap = { version = "4.4", features = ["derive"] }
tiny_http = "0.12"
open = "5"
keyring = "2"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
mime_guess = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
dirs = "5"
hostname = "0.4"
self-replace = "1"
semver = "1"

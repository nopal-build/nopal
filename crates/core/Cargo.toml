[package]
name = "nopal-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared Nopal auth + Vault REST client — used by the `nopal` CLI and the native macOS app"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "2"
rand = "0.8"
sha2 = "0.10"
mime_guess = "2"
tiny_http = "0.12"
open = "5"
urlencoding = "2"
dirs = "5"
hostname = "0.4"

[package.metadata.dist]
dist = false

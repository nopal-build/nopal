# fly.toml app configuration file generated for webapp-billowing-meadow-8538 on 2024-09-25T15:05:30-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Build context is the REPO ROOT (webapp depends on the `robustness-core`/
# `oxmarkdown-core` workspace packages) — deploy from the repo root:
#
#   fly deploy . --config webapp/fly.toml --dockerfile webapp/Dockerfile
#
# (`make deploy` does this for you.) GraphLog's queue worker is its own,
# separate Fly app — see packages/worker/fly.toml. A staging copy of THIS
# app lives at fly.staging.toml (`make deploy-staging`) — same image,
# separate Fly app, pointed at an isolated `staging` database instead of
# prod's `opuntia` (see db/clone-to-staging.sh).

app = 'webapp-billowing-meadow-8538'
# Co-located with the DB (`db/fly.toml`'s own `primary_region`) -- see the
# `fruits-performance-followup` garden seed. Was `lax`; moved to `dfw` to
# put app and DB in the same region (the cross-region round trip was the
# real cost the seed's investigation found, not query complexity), and
# because `dfw` serves this business's central/eastern US customers
# better than `lax` would. See that seed for the full migration runbook
# (staging dry run first, Redis-location check, scale-up/scale-down
# sequence) before actually cutting prod traffic over.
primary_region = 'dfw'

[build]

# The app service's own public URL -- webapp no longer serves login/vault/
# etc itself (see docs/marketing-app-split-plan.md), but a couple of
# marketing pages still need to link INTO the app (the "Log in" footer
# link, the WC waiver admin-notification email's legal-document link).
# Matches app/routes/docs.wc-waiver.tsx's own default when unset, so this
# is set explicitly here mainly for documentation/safety, not because
# anything breaks without it.
[env]
APP_BASE_URL = 'https://o.nopal.build'

# Zero-downtime deploys: boot a full parallel machine per existing one,
# wait for /api/health to pass on all of them, THEN flip traffic and kill
# the old ones — requires at least one health check (below) to be defined.
[deploy]
strategy = 'bluegreen'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 2
processes = ['app']

[[http_service.checks]]
grace_period = '10s'
interval = '15s'
method = 'GET'
path = '/api/health'
timeout = '5s'

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1

# fly.toml app configuration file generated for webapp-billowing-meadow-8538 on 2024-09-25T15:05:30-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Build context is the REPO ROOT (webapp depends on the `robustness-core`/
# `oxmarkdown-core` workspace packages) — deploy from the repo root:
#
#   fly deploy . --config webapp/fly.toml --dockerfile webapp/Dockerfile
#
# (`make deploy` does this for you.) PhyLog's queue worker is its own,
# separate Fly app — see packages/worker/fly.toml and the `phylog` skill's
# "Scaling & Process Isolation" section.

app = 'webapp-billowing-meadow-8538'
primary_region = 'lax'

[build]

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1

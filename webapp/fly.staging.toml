# fly.toml for a staging copy of the webapp — same image as fly.toml,
# deployed to its own Fly app so it never touches production traffic.
#
# First-time setup (app already created — `fly apps create
# nopal-webapp-staging`):
#   1. sh webapp/scripts/copy-secrets-to-staging.sh   (copies prod's secrets
#      verbatim, run from YOUR terminal, never through a third party)
#   2. make deploy-staging
#   3. make clone-staging-db SURREAL_PASS=<prod-pass>   (populates the
#      `staging` database — empty until this runs at least once)
#
# Build context is the REPO ROOT — deploy from the repo root:
#
#   fly deploy . --config webapp/fly.staging.toml --dockerfile webapp/Dockerfile

app = 'nopal-webapp-staging'
primary_region = 'lax'

[build]

[deploy]
strategy = 'bluegreen'

[env]
# The only thing that differs from prod's own env/secrets — see
# packages/robustness-core/src/data/db.server.ts. Everything else
# (DATABASE_URL, credentials, NS) is identical to prod on purpose: this
# is the SAME SurrealDB instance, just a different `database` selected.
DATABASE_DATABASE = 'staging'
# Points staging's own "Log in"/legal-document links at fruits' STAGING
# app, not prod's o.nopal.build — see webapp/fly.toml's own comment on
# APP_BASE_URL for why this exists at all. Update if fruits-staging's
# real Fly-assigned hostname/custom domain ends up different from this.
APP_BASE_URL = 'https://fruits-staging.fly.dev'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[http_service.checks]]
grace_period = '10s'
interval = '15s'
method = 'GET'
path = '/api/health'
timeout = '5s'

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1

[workspace]
members = ["cargo:crates"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Only build the package(s) actually being released, not the whole
# workspace — nopal-api's build.rs needs `protoc`, which isn't installed
# on release runners and isn't needed for the CLI anyway.
precise-builds = true
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# The `keyring` crate needs libdbus + pkg-config to build on Linux (its
# secret-service backend) — not present on GitHub's Linux runners by default.
[dist.dependencies.apt]
libdbus-1-dev = '*'
pkg-config = '*'

# fly.toml for GraphLog's queue worker (app name predates the PhyLog ->
# GraphLog rename — see the `graphlog` skill) — its own Fly app, not a
# process group under the webapp app, since it has a genuinely different,
# much smaller dependency graph, and scaling/deploying it independently
# is the whole point.
#
# Build context is the REPO ROOT — deploy from the repo root:
#
#   fly deploy . --config packages/worker/fly.toml --dockerfile packages/worker/Dockerfile
#
# (`make deploy` does this for you.)
#
# Safe to run more than one machine: `worker.ts`'s own concurrency-safety
# is enforced via a Redis lock per PROJECT (see worker.ts's own
# `CONCURRENCY` comment), not by there only ever being one process —
# BullMQ's own job-claiming means two machines pulling from the same
# queue never double-process the same job. `fly scale count 2` for
# redundancy is safe here without any code change.

app = 'nopal-phylog-worker'
# Co-located with the DB (`db/fly.toml`'s own `primary_region`) -- see the
# `fruits-performance-followup` garden seed. Was `lax`; moved to `dfw` to
# put every piece (app, worker, DB) in the same region.
primary_region = 'dfw'

[build]

# Where the worker finds the app, to print a deliverable's public page
# (`deliverablePdfRender.server.ts`).
[env]
APP_BASE_URL = 'https://o.nopal.build'

# No [http_service] — this app never serves HTTP, so it gets no public
# listener at all. It just needs to stay running to drain the queue. No
# `[deploy] strategy = 'bluegreen'` either — that requires a health check,
# and there's no user-facing traffic to cut over for a background worker;
# the default rolling strategy (stop old, start new) is fine, since an
# in-flight job either finishes before its machine is replaced or gets
# retried by BullMQ.
[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1

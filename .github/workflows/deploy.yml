name: Deploy

# main always: runs tests, then deploys to staging automatically.
# Production only follows if a required reviewer approves the
# `production` GitHub Environment (configured in repo Settings ->
# Environments -- see db/README.md's "Staging environment" section and
# the root README's "Deploy pipeline" section for the full picture).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two INDEPENDENT concurrency scopes, not one shared across the whole
# workflow -- a single shared group would mean a new push's `test`/
# `deploy-staging` can't even START while an OLDER run's production job
# sits waiting on a required-reviewer approval that may never come. This
# (workflow-level) scope covers `test`/`deploy-staging` only, since
# neither has its own `concurrency:` block below.
#
# cancel-in-progress: true here is low-risk -- staging isn't customer-
# facing, and there's nothing "in flight" worth protecting if a newer
# commit supersedes an older one's test/staging run.
concurrency:
  group: nopal-deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter remix run test --run
      - run: pnpm --filter fruits run test --run

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: '0.4.99'

      # webapp + fruits only -- staging has no worker/DB of its own, see
      # webapp/fly.staging.toml + fruits/fly.staging.toml.
      - run: flyctl deploy . --config webapp/fly.staging.toml --dockerfile webapp/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - run: flyctl deploy . --config fruits/fly.staging.toml --dockerfile fruits/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify Discord
        if: always()
        uses: ./.github/actions/notify-discord
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          environment-name: staging
          status: ${{ job.status }}

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    # Own concurrency scope, independent of the workflow-level one above
    # -- so an OLDER run stuck waiting on approval gets cancelled the
    # instant a newer push's production job wants to start, without that
    # newer push having had to wait behind it for test/staging first.
    #
    # cancel-in-progress: true does carry one real, accepted risk: GitHub
    # doesn't distinguish "a job merely WAITING on approval" from "a job
    # ACTIVELY running flyctl deploy" for concurrency purposes -- both
    # occupy this group, and both get cancelled the same way when a newer
    # push wants the group. So if an older run's approval comes through
    # and it's mid-deploy at the exact moment a newer push shows up,
    # that in-flight deploy gets killed rather than left to finish -- a
    # genuinely bad time to lose db/webapp/worker mid-rollout. That
    # window is narrow (roughly the time between an approval click and
    # three `flyctl deploy` calls finishing) but not zero.
    #
    # If that risk ever matters more than the convenience, flip this to
    # `false` instead -- but that removes auto-cancellation ENTIRELY for
    # this job, including the waiting-on-approval case: an old run stuck
    # waiting for a reviewer would then block every newer push's
    # production job in a growing queue until a human manually cancels
    # it (Actions tab) or approves/rejects it. There's no built-in
    # "cancel only if waiting, never if running" option -- it's an
    # all-or-nothing switch.
    concurrency:
      group: nopal-deploy-production-${{ github.ref }}
      cancel-in-progress: true
    # This is the actual approval gate -- the `production` Environment
    # has required reviewers configured (gwing33, a-trautman), so this
    # job pauses here until one of them approves it in the Actions UI.
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: '0.4.99'

      # Same order make deploy uses: db (runs migrations via its own
      # release_command) first, then webapp, then fruits, then worker.
      #
      # db deploys with `working-directory: db`, NOT `--config db/fly.toml`
      # from the repo root -- db/fly.toml has no explicit [build] context/
      # dockerfile override, so it resolves both relative to the CURRENT
      # directory. `make deploy`'s own `cd db && fly deploy` relies on
      # exactly this; running it from the repo root instead would build
      # with the wrong context.
      - run: flyctl deploy --remote-only
        working-directory: db
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - run: flyctl deploy . --config webapp/fly.toml --dockerfile webapp/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - run: flyctl deploy . --config fruits/fly.toml --dockerfile fruits/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - run: flyctl deploy . --config packages/worker/fly.toml --dockerfile packages/worker/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify Discord
        if: always()
        uses: ./.github/actions/notify-discord
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          environment-name: production
          status: ${{ job.status }}
